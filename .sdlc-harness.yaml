# ABOUTME: Pins this repo's sdlc agent-harness routing (Story 20.7-005).
# ABOUTME: Precedence: --harness flag > this file > registry default > built-in claude.
#
# Why pin to `claude` when `claude` is also the shipped registry default?
# Because the registry (`sdlc/config/harnesses.yaml`) lives *inside* the installed
# controller, so `./scripts/install-controller.sh` (uv tool install --force) resets
# it on every redeploy. This file lives in the repo and survives reinstalls, so the
# routing declared here is the one that actually holds.
#
# Pinning is inert at dispatch: the registry's `claude` entry resolves to the same
# argv as the built-in default (same Story 13.1-001 deny baseline, same parser), so
# builds behave identically to having no file at all. What it buys is that a flip of
# the registry `default:` — or a colleague's differently-configured install — cannot
# silently move this repo onto another agent.
#
# Deliberately claude, not codex/qwen: this repo runs the largest parallel epic
# builds, and claude is the only harness with worktree isolation, parallel execution,
# usage tracking and rate-limit awareness. It is also the repo that *implements*
# harness routing, so degrading it here would mask bugs in the feature itself.
#
# Per-role overrides are available if a single role should differ, e.g.:
#   harness:
#     default: claude
#     roles:
#       review: codex     # roles: build | coverage (alias: qa) | review | merge | docs
harness:
  default: claude
