# ABOUTME: Registry of agent harnesses the controller can dispatch to (Story 20.1-001).
# ABOUTME: One entry per harness — command template, invocation flags, capability flags, parser id.
#
# This file generalizes the dispatch seam (controller/src/sdlc/dispatch.py) and the
# adversarial-reviewers registry into one config-driven harness abstraction. Adding a
# new harness is a config + wrapper-script change here, not a Python change.
#
# The controller does NOT auto-load this file for the default dispatch path: with no
# registry wired and no `SDLC_AGENT_CMD`, behaviour is byte-identical to the built-in
# `claude -p` default (see dispatch.DEFAULT_AGENT_CMD). Role routing (Story 20.2-001)
# is what points the controller at a registry entry by name.
#
# Command templates may use {pr_number}, {pr_url}, and {story_id} placeholders, which
# the controller substitutes before invoking the harness (same style as the reviewer
# registry).

# Global default harness toggle.
#
# `default:` selects the active harness for EVERY pipeline role (build, coverage,
# review, merge, docs) unless overridden by a `--harness role=…` CLI flag or a
# per-repo `.sdlc-harness.yaml`. Precedence: --harness flag > repo file >
# this default > built-in claude.
#
# To switch the whole controller to another harness, make exactly one `default:`
# line active (uncomment it) and comment the others out — keep only ONE active
# `default:` key so this stays valid YAML.
#
# NOTE: this file ships INSIDE the installed controller, so `uv tool install
# --force` overwrites it back to the shipped default below. For a redeploy-safe,
# per-repo switch that survives reinstalls, drop a `.sdlc-harness.yaml` in the
# target repo instead of editing this line.
default: claude
# default: codex

harnesses:
  # The built-in default. This entry mirrors dispatch.DEFAULT_AGENT_CMD for
  # introspection; the dispatch seam still applies the deny baseline
  # (Story 13.1-001) and the routed --model (Story 14.2-001) as decorations at
  # resolve time, so they are not repeated in this static template.
  claude:
    command: "claude -p --output-format stream-json --verbose --dangerously-skip-permissions"
    parser: claude-stream-json
    enabled: true
    # Issue #564: the cheap live-API check `sdlc resume` runs before honouring a
    # persisted rate-limit reset epoch — one two-token prompt on the cheapest
    # model. A zero exit with no rate-limit wording means the window is open, so
    # a reset epoch left behind by (say) a network blip is cleared and the run
    # continues; anything else keeps it parked. Mirrors the built-in slot's
    # `harness.CLAUDE_RATE_LIMIT_PROBE`.
    rate_limit_probe: "claude -p ok --model haiku"
    capabilities:
      worktree_isolation: true
      parallel: true
      json_contract: true
      usage_tracking: true
      rate_limit_aware: true

  # First concrete non-Claude adapter (Story 20.3-001). The wrapper
  # `scripts/codex-build-adapter.sh` receives the assembled prompt on stdin, runs
  # Codex via `codex exec`, and forwards the harness-neutral <<<RESULT_JSON>>>
  # contract on stdout. Codex has no stream-json / usage / rate-limit semantics,
  # so those capabilities are false and the run degrades safely (Feature 20.5).
  # The wrapper only ever runs `codex`, so a run routed here spawns zero `claude`
  # processes (AC3).
  codex:
    # Default: no `{model}` placeholder, so the adapter runs plain `codex exec`
    # and Codex uses the model from your `~/.codex/config.toml` (e.g. `gpt-5.5`).
    # This is portable — it never assumes a model entitlement, so a build works on
    # any authenticated Codex out of the box (issue #228: the old hardcoded
    # `gpt-5.4-codex*` ids 400'd on a ChatGPT-account Codex).
    command: "codex-build-adapter.sh"
    parser: codex-exec
    enabled: true
    # Optional preflight check (Story 20.5-001): confirms the Codex CLI is
    # installed/authenticated before a run routes a role to it. A zero exit is
    # "available"; a non-zero exit degrades to a warning rather than a mid-run
    # crash. Omit `probe` entirely to skip the check (status "unknown").
    probe: "codex --version"
    # Per-stage model routing (Story 20.7-004) is an opt-in — the OpenAI analog of
    # Epic-14's Balanced map. To enable it, add `--model {model}` to `command`
    # above and uncomment a `models:` map of stage -> a model id YOU are entitled
    # to (verify with `echo hi | codex exec --model <id>`). `default` is required
    # and covers any unlisted stage (e.g. bugfix/reask). Example:
    #   command: "codex-build-adapter.sh --model {model}"
    #   models:
    #     default: gpt-5.5
    #     build: gpt-5.5
    #     coverage: gpt-5.5
    #     review: gpt-5.5
    #     merge: gpt-5.5
    #     adversarial: gpt-5.5
    capabilities:
      worktree_isolation: false
      parallel: false
      json_contract: true
      usage_tracking: false
      rate_limit_aware: false

  # Qwen Code adapter. The wrapper receives the assembled prompt on stdin and
  # runs Qwen Code headlessly with `qwen -p "$prompt"`, forwarding the neutral
  # <<<RESULT_JSON>>> contract to the same plain parser used by Codex. Qwen Code
  # does not expose Claude-style stream-json / usage / rate-limit telemetry
  # through this wrapper, so those capabilities stay false.
  #
  # worktree_isolation / parallel verified-negative (Story 29.1-001, evidence:
  # controller/eval/results/qwen-worktree-smoke-29.1-001.json, 2026-09-05, qwen
  # 0.21.10): scripts/qwen-worktree-smoke.sh cut two concurrent git worktrees
  # and ran the adapter in each. Isolation itself held (both worktrees stayed
  # confined, no cross-contamination, scratch repo root untouched) — but qwen
  # never completed the requested edit in either worktree because no auth type
  # is configured on the verification host and the CLI's `qwen auth`
  # subcommand is marked "(removed)" in this version, so there is no headless
  # way to configure one; a prior probe found the free OAuth tier was also
  # discontinued (2026-04-15). `--yolo` (equivalently `--approval-mode yolo`,
  # undocumented in `qwen --help`) is the flag needed for unattended tool
  # execution — set it via QWEN_FLAGS — but it does not bypass the auth check.
  # Flip both flags to true once re-run on a host with a configured qwen auth
  # provider confirms the edit actually completes.
  qwen:
    command: "qwen-build-adapter.sh"
    parser: codex-exec
    enabled: true
    probe: "qwen --version"
    capabilities:
      worktree_isolation: false
      parallel: false
      json_contract: true
      usage_tracking: false
      rate_limit_aware: false

  # OpenCode adapter (Story 29.2-001). The wrapper receives the assembled
  # prompt on stdin and runs OpenCode headlessly via `opencode run --pure`,
  # letting the prompt flow through on stdin (`run` reads its message there when
  # given no positional), forwarding the neutral <<<RESULT_JSON>>> contract — with ANSI
  # colour stripped, since OpenCode 1.18.15 emits CSI escapes even off a TTY —
  # to the same plain parser used by Codex and Qwen. OpenCode does not expose
  # Claude-style stream-json / usage / rate-limit telemetry through this
  # wrapper, so those capabilities stay false.
  #
  # REQUIRED for unattended dispatch: the target repo's `opencode.json` must
  # set `"permission": { "edit": "allow", "bash": "allow" }` (or an equivalent
  # `--auto`). Without it, OpenCode blocks a headless run on an interactive
  # approval prompt it has no TTY to answer, and the run hangs indefinitely
  # rather than failing fast — verified against a real OpenCode 1.18.15.
  #
  # ALSO REQUIRED: OpenCode's *resolved default model* must be reachable and
  # authenticated. This entry pins no model on purpose (see below), so OpenCode
  # falls back to whatever its own config selects — and if that points at a
  # provider that is not answering (the common case: a `localhost` llama-server
  # entry left in `opencode.json` with nothing listening), `opencode run` prints
  # its banner and then blocks forever instead of erroring. Codex does not share
  # this failure mode (`codex exec` 400s fast on an unusable model), so the
  # blast radius is OpenCode-specific and large: this adapter always dispatches
  # on the *captured* path, where dispatch.py's 300s output-idle stall detector
  # does not apply (it is streaming-only), leaving only DEFAULT_TIMEOUT_S =
  # 3600. Every routed stage therefore burns a silent hour, and a full
  # build/coverage/review/merge/adversarial run burns about five.
  # Before routing a role here, confirm the default answers:
  #   echo ping | opencode run --pure
  # If it hangs, either fix OpenCode's own default provider or name a known-good
  # model for every dispatch without editing this shipped file:
  #   export OPENCODE_FLAGS='--model anthropic/claude-haiku-4-5'
  # (`OPENCODE_FLAGS` is read by `opencode-build-adapter.sh` and inserted ahead
  # of the CLI's own flags; it survives `uv tool install --force`, which the
  # `models:` map below does not.)
  opencode:
    # A model is pinned deliberately, against the issue-#228 "never assume an
    # entitlement" instinct, because that instinct does not transfer here.
    # `codex exec` fails fast on a model you cannot reach; OpenCode *hangs* —
    # it resolves whatever its own config names as default, and an unreachable
    # provider (e.g. a local llama-server that is not running) prints a banner
    # and then nothing. The captured dispatch path has no stall detector
    # (dispatch.py:713), so `DEFAULT_TIMEOUT_S = 3600` is the only backstop:
    # one silent hour per stage, ~5 for a full build/coverage/review/merge/
    # adversarial run. An unreachable default is the more likely failure than
    # an unentitled pin, so the map below names ids verified on this host.
    # Not entitled to these? Override without editing this file (redeploy-safe):
    #   export OPENCODE_FLAGS='--model <provider/model>'
    command: "opencode-build-adapter.sh --model {model}"
    parser: codex-exec
    enabled: true
    probe: "opencode --version"
    # Per-stage routing, mirroring Epic-14's Balanced profile
    # (model_routing.py:132) so an opencode run costs what a claude run costs.
    # `default` is required and covers any unlisted stage. Verified reachable
    # on this host with `printf hi | opencode run --pure --model <id>`.
    models:
      default: anthropic/claude-sonnet-5
      discovery: anthropic/claude-haiku-4-5
      build: anthropic/claude-sonnet-5
      coverage: anthropic/claude-sonnet-5
      review: anthropic/claude-sonnet-5
      adversarial: anthropic/claude-sonnet-5
      bugfix: anthropic/claude-sonnet-5
      merge: anthropic/claude-haiku-4-5
      reask: anthropic/claude-haiku-4-5
    capabilities:
      worktree_isolation: false
      parallel: false
      json_contract: true
      usage_tracking: false
      rate_limit_aware: false
